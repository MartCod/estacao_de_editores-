# Bloco /painel sugerido para /etc/nginx/sites-available/apps (Estação 2.0)
# Substitui o bloco "location /painel { ... }" atual. Depois:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Corrige:
#  - item 5: .git, arquivos ocultos e arquivos de projeto (.sql, .md, .ts...)
#    deixam de ser servidos (hoje /painel/.git/config responde 200);
#  - try_files: o fallback apontava para /index.html na raiz (que dá 404),
#    agora aponta para o index do painel;
#  - cabeçalhos de segurança básicos.
# Coloque também "server_tokens off;" dentro do bloco server { } para não
# exibir a versão do nginx.

    location ^~ /painel/ {
        alias /var/www/estacao_de_editores-/;

        # nada que comece com ponto (.git, .gitattributes, .env ...)
        location ~ /\. { deny all; return 404; }
        # arquivos do projeto que não fazem parte do site
        location ~* \.(sql|md|ts|sh|conf|txt|json)$ { deny all; return 404; }
        location ^~ /painel/supabase/ { deny all; return 404; }
        location ^~ /painel/deploy/   { deny all; return 404; }
        location ^~ /painel/testes/   { deny all; return 404; }

        try_files $uri $uri/ /painel/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /painel { return 301 /painel/; }
