<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estação de Editores</title>
  
  <style>
  
/* outros estilos do seu site */

/* Indicador de salvamento */
.save-status{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  padding: 8px 12px;
  border: 1px solid #263244;
  border-radius: 6px;
  transition: opacity .2s ease, border-color .2s ease;
}

.save-status.saved{
  color: #38d996;
  border-color: rgba(56,217,150,.35);
}

.save-status.saving{
  color: #f0c75e;
  border-color: rgba(240,199,94,.35);
}

.save-status.error{
  color: #ff5c6c;
  border-color: rgba(255,92,108,.35);
}

</style>

<style>
  :root{
    --bg: #0e1013;
    --bg-vignette: radial-gradient(ellipse at top, #171a20 0%, #0e1013 60%);
    --panel: #181b22;
    --panel-2: #1e222b;
    --panel-3: #23272f;
    --line: #2a2f3a;
    --line-soft: #23272f;
    --text: #eef0f4;
    --text-dim: #9aa1ae;
    --text-faint: #5f6675;
    --amber: #f2a93b;
    --amber-dim: #4a3b1e;
    --red: #e4572e;
    --red-dim: #45241a;
    --teal: #4cc9a6;
    --teal-dim: #1c3a30;
    --blue: #4d8dff;
    --blue-dim: #1c2b47;
    --gray: #7b8390;
    --gray-dim: #2a2e37;
    --green: #35c46a;
    --green-dim: #163a25;
    --radius: 14px;
    --font-display: 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  body.theme-light{
    --bg: #f3f4f7;
    --bg-vignette: radial-gradient(ellipse at top, #ffffff 0%, #edeff3 60%);
    --panel: #ffffff;
    --panel-2: #f4f5f7;
    --panel-3: #eceef2;
    --line: #dadde3;
    --line-soft: #e6e8ec;
    --text: #1b1e24;
    --text-dim: #565d6b;
    --text-faint: #8e95a3;
    --amber-dim: #fcecd2;
    --red-dim: #fbe1d9;
    --teal-dim: #d9f5ec;
    --blue-dim: #dde8ff;
    --gray-dim: #e8eaee;
    --green-dim: #dcf7e6;
  }
  body.theme-light select.urg-select[data-v="baixa"]{ color:#0f6b52; }
  body.theme-light select.urg-select[data-v="media"]{ color:#8a5c05; }
  body.theme-light select.urg-select[data-v="alta"]{ color:#a83214; }
  body.theme-light select.status-select[data-v="pendente"]{ color:#4b5563; }
  body.theme-light select.status-select[data-v="fazendo"]{ color:#1d4ed8; }
  body.theme-light select.status-select[data-v="concluido"]{ color:#15803d; }
  body.theme-light select.revstatus-select[data-v="pendente"]{ color:#4b5563; }
  body.theme-light select.revstatus-select[data-v="andamento"]{ color:#1d4ed8; }
  body.theme-light select.revstatus-select[data-v="revisado"]{ color:#15803d; }
  body.theme-light select.revstatus-select[data-v="erro"]{ color:#a83214; }
  body.theme-light .path-field input{ color:#0f8a6c; }
  body.theme-light .movie-header{ background: repeating-linear-gradient(-45deg, #eef0f4 0 22px, #e2e5eb 22px 44px); }
  body.theme-light .progress-seg.pendente{ background: repeating-linear-gradient(135deg, #d8dce2 0 6px, #cbcfd7 6px 12px); }
  body.theme-light .movie-chip.active{ color:#1a1305; }
  body.theme-light .dept-tab.active{ box-shadow: 0 1px 0 rgba(0,0,0,.02); }

  /* ---------- IDENTIDADE DE COR POR DEPARTAMENTO ----------
     O acento "amarelo" (--amber) do tema passa a acompanhar a cor
     do departamento ativo: Vocal = verde, Música = vermelho, Efeitos = azul. */
  body.dept-vocal{ --amber: var(--green); --amber-dim: var(--green-dim); }
  body.dept-musica{ --amber: var(--red); --amber-dim: var(--red-dim); }
  body.dept-efeitos{ --amber: var(--blue); --amber-dim: var(--blue-dim); }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg-vignette);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 28px 20px 80px;
    transition: background .2s ease, color .2s ease;
  }
  .wrap{ max-width: 1600px; margin: 0 auto; }

  /* ---------- LAYOUT GERAL: CONTEÚDO + BARRA LATERAL DE ABAS ---------- */
  .station-layout{ display:flex; align-items:flex-start; gap:26px; }
  .station-main{ flex: 1 1 auto; min-width: 0; }
  .station-side{ width: 240px; flex-shrink:0; position: sticky; top: 20px; }

  /* ---------- HEADER / SLATE ---------- */
  .masthead{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .slate-icon{
    width: 46px; height: 46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 32px; line-height:1;
  }
  .masthead h1{
    font-family: var(--font-display);
    font-weight:800;
    font-size: 25px;
    letter-spacing: 1.2px;
    line-height: 1;
    text-transform: uppercase;
  }
  .masthead p{ color: var(--text-dim); font-size: 13px; margin-top: 4px;}
  .masthead .titles{ flex:1 1 260px; }
  .io-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .io-btn{
    font-size:12px; font-weight:600; color: var(--text-dim); background: var(--panel);
    border:1px solid var(--line); padding: 9px 14px; border-radius:8px; cursor:pointer;
  }
  .io-btn:hover{ color: var(--text); border-color: var(--teal); }
  .io-btn.primary{ color: var(--amber); border-color: color-mix(in srgb, var(--amber) 35%, transparent); background: var(--amber-dim); }
  .io-btn.primary:hover{ background: color-mix(in srgb, var(--amber) 22%, transparent); }

  .theme-toggle{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .theme-btn{
    padding:9px 14px; font-size:12px; font-weight:700; background:var(--panel);
    color:var(--text-dim); border:none; cursor:pointer;
  }
  .theme-btn + .theme-btn{ border-left:1px solid var(--line); }
  .theme-btn.active{ background: var(--amber); color:#1a1305; }

  /* ---------- DEPARTMENT TABS (barra lateral direita, cada aba com cor de identidade) ---------- */
  .dept-tabs{ display:flex; flex-direction:column; gap:12px; }
  .dept-tab{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 16px 18px; border-radius: 12px; background: var(--panel);
    border: 1.5px solid var(--line); border-left-width: 6px;
    cursor:pointer; transition: all .15s ease;
  }
  .dept-tab[data-dept="vocal"]{ --dept-color: var(--green); --dept-color-dim: var(--green-dim); }
  .dept-tab[data-dept="efeitos"]{ --dept-color: var(--blue); --dept-color-dim: var(--blue-dim); }
  .dept-tab[data-dept="musica"]{ --dept-color: var(--red); --dept-color-dim: var(--red-dim); }
  .dept-tab{ border-color: var(--dept-color); }
  .dept-tab:hover{ background: var(--dept-color-dim); }
  .dept-tab.active{ background: var(--dept-color-dim); box-shadow: 0 0 0 1px var(--dept-color) inset; }
  .dept-tab-left{ display:flex; flex-direction:column; gap:4px; }
  .dept-name{
    font-family: var(--font-display); font-weight:800; text-transform:uppercase;
    letter-spacing:.7px; font-size: 16px; color: var(--dept-color);
  }
  .dept-status-label{ font-size: 11px; font-weight:600; color: var(--text-dim); }
  .dept-status-dot{
    width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px solid transparent;
  }
  .dept-status-dot.pendente{ background: var(--gray); }
  .dept-status-dot.fazendo{ background: var(--dept-color); box-shadow:0 0 8px color-mix(in srgb, var(--dept-color) 55%, transparent); }
  .dept-status-dot.concluido{ background: var(--green); box-shadow:0 0 8px rgba(53,196,106,.55); }
  .dept-status-dot.vazio{ background: transparent; border-color: var(--line); }

  @media (max-width: 980px){
    .station-layout{ flex-direction: column; }
    .station-side{ width:100%; position:static; }
    .dept-tabs{ flex-direction:row; flex-wrap:wrap; }
    .dept-tab{ flex:1 1 180px; }
  }

 /* ---------- MOVIE TABS / FILA DE PRODUÇÃO ---------- */

.movie-tabs{
  margin-bottom: 22px;
}

.production-queue{
  width:100%;
}

/* FILME ATUAL */

.current-movie-card{
  width:100%;
  box-sizing:border-box;
  padding:24px 28px;
  margin-bottom:22px;
  border:2px solid var(--teal);
  border-radius:16px;
  background:linear-gradient(
    135deg,
    rgba(20,184,166,.12),
    rgba(15,23,42,.55)
  );
  cursor:pointer;
  transition:.18s ease;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.current-movie-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.current-movie-label{
  font-family:var(--font-body);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--teal);
  margin-bottom:12px;
}

.current-movie-title{
  font-family:var(--font-display);
  font-size:25px;
  font-weight:800;
  color:var(--text);
}

/* TÍTULO DA FILA */

.queue-title{
  margin:4px 0 12px 4px;
  font-family:var(--font-body);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--text-dim);
}

/* PRÓXIMOS FILMES */

.movie-queue-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
}

.queue-movie-card{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:82px;
  padding:14px 16px;
  box-sizing:border-box;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  cursor:pointer;
  transition:.18s ease;
}

.queue-movie-card:hover{
  border-color:var(--amber);
  transform:translateY(-2px);
}

.queue-number{
  min-width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--amber-dim);
  color:var(--amber);
  font-family:var(--font-display);
  font-size:15px;
  font-weight:800;
}

.queue-movie-info{
  min-width:0;
}

.queue-status{
  font-family:var(--font-body);
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--text-dim);
  margin-bottom:5px;
}

.queue-movie-name{
  font-family:var(--font-body);
  font-size:14px;
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
  .set-production-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:10px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(239,68,68,.55);
  background:rgba(239,68,68,.12);
  color:#ef4444;
  font-family:var(--font-body);
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
  cursor:pointer;
  transition:.18s ease;
}

.set-production-btn:hover{
  background:#ef4444;
  color:#fff;
  border-color:#ef4444;
}

/* BOTÕES */

.queue-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.add-movie-btn{
  font-family:var(--font-body);
  font-weight:700;
  font-size:13.5px;
  padding:9px 16px;
  border-radius:999px;
  background:transparent;
  border:1.5px dashed var(--line);
  color:var(--text-dim);
  cursor:pointer;
}

.add-movie-btn:hover{
  border-color:var(--teal);
  color:var(--teal);
}

.history-btn{
  font-family:var(--font-body);
  font-weight:700;
  font-size:13.5px;
  padding:9px 16px;
  border-radius:999px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--text-dim);
  cursor:pointer;
}

.history-btn:hover,
.history-btn.active{
  border-color:var(--amber);
  color:var(--amber);
  background:var(--amber-dim);
}

  /* ---------- HISTÓRICO DE FILMES CONCLUÍDOS ---------- */
  .history-panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .history-heading{ padding:22px 24px 16px; border-bottom:1px solid var(--line); }
  .history-heading h2{ margin:0 0 5px; font-family:var(--font-display); font-size:20px; }
  .history-heading p{ margin:0; color:var(--text-dim); font-size:13px; }
  .history-table{ width:100%; border-collapse:collapse; min-width:720px; }
  .history-table th, .history-table td{ padding:14px 16px; text-align:left; border-bottom:1px solid var(--line); font-size:13px; }
  .history-table th{ color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .history-table tr:last-child td{ border-bottom:none; }
  .history-empty{ padding:34px 24px; color:var(--text-dim); text-align:center; }

  /* ---------- EMPTY STATE ---------- */
  .empty{
    text-align:center; padding: 70px 20px; color: var(--text-dim);
    background: var(--panel); border-radius: var(--radius); border:1px solid var(--line-soft);
  }
  .empty h2{ font-family: var(--font-display); font-weight:800; text-transform:uppercase; font-size: 22px; color: var(--text); margin-bottom:8px; letter-spacing:.6px;}
  .empty button{
    margin-top: 18px; font-family: var(--font-body); font-weight:700; font-size:14px;
    background: var(--amber); color:#1a1305; border:none; padding: 11px 22px; border-radius:9px; cursor:pointer;
  }

  /* ---------- MOVIE PANEL ---------- */
  .movie-panel{
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    overflow: visible;
    margin-bottom: 24px;
  }
  .movie-header{
    background: repeating-linear-gradient(-45deg, #21252d 0 22px, #1a1d24 22px 44px);
    padding: 26px;
    border-bottom: 1px solid var(--line);
    border-radius: var(--radius) var(--radius) 0 0;
    display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; justify-content:space-between;
  }
  .movie-identity{ display:flex; gap:22px; align-items:center; flex:1 1 420px; }
  .movie-title-field{ flex: 1 1 260px; align-self:center; }

  /* ---------- POSTER UPLOAD (formato vertical, estilo poster de celular) ---------- */
  .poster-upload{
    width: 168px; aspect-ratio: 9 / 16; border-radius: 16px; flex-shrink:0;
    border: 2px dashed var(--line); background: var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; overflow:hidden;
    transition: border-color .15s ease, background .15s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
  }
  .poster-upload:hover{ border-color: var(--teal); background: var(--panel-3); }
  .poster-upload img{ width:100%; height:100%; object-fit:cover; display:block; }
  .poster-plus{ font-size:54px; font-weight:700; color: var(--text-faint); line-height:1; transition: color .15s ease; }
  .poster-upload:hover .poster-plus{ color: var(--teal); }
  .poster-hint{ font-size:9.5px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; text-align:center; padding:0 4px; }
  .poster-remove{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
    background: rgba(0,0,0,.6); color:#fff; border:none; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .poster-remove:hover{ background: var(--red); }
  .field-label{
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-faint); font-weight:700; margin-bottom:8px; display:block;
  }
  .movie-title-field input{
    font-family: var(--font-display); font-weight:800; text-transform:uppercase;
    font-size: 34px; letter-spacing:.6px;
    background: transparent; border:none; border-bottom: 2px solid transparent;
    color: var(--text); width:100%; padding: 4px 0;
  }
  .movie-title-field input:focus{ outline:none; border-bottom-color: var(--amber); }
  .movie-title-field input::placeholder{ color: var(--text-faint); }

  .del-movie-btn{
    font-size:12px; font-weight:600; color: var(--red); background: var(--red-dim);
    border: 1px solid rgba(228,87,46,.35); padding: 8px 12px; border-radius:8px; cursor:pointer;
    white-space:nowrap; align-self: flex-start;
  }
  .del-movie-btn:hover{ background: rgba(228,87,46,.25); }
  .complete-movie-btn{
    font-size:12px; font-weight:600; color:#a9c4ff; background:var(--blue-dim);
    border:1px solid rgba(77,141,255,.45); padding:8px 12px; border-radius:8px;
    cursor:pointer; white-space:nowrap; align-self:flex-start;
  }
  .complete-movie-btn:hover{ background:rgba(77,141,255,.25); }
  .readonly-value{ color:var(--text); font-size:13px; font-weight:600; padding:8px 0; min-height:34px; }
  .readonly-path{ color:var(--teal); font-family:var(--font-mono); font-size:13px; overflow-wrap:anywhere; }

  .path-row{
    padding: 16px 22px;
    border-bottom: 1px solid var(--line-soft);
    display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;
  }
  .path-field{ flex: 1 1 380px; }
  .path-audio-field{
  margin-top: 14px;
}

.audio-path-label{
  display: block;
  margin-bottom: 7px;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-faint);
  font-weight: 700;
}
  .path-field .input-shell{
    display:flex; align-items:center; gap:8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px;
  }
  .path-field input{
    background:transparent; border:none; color: var(--teal); font-family: var(--font-mono);
    font-size: 13px; width:100%;
  }
  .path-field input::placeholder{ color: var(--text-faint); font-family: var(--font-body); }
  .path-field input:focus{ outline:none; }
  .copy-btn{
    background: var(--panel-2); border:1px solid var(--line); color: var(--text-dim);
    font-size:12px; font-weight:600; padding: 8px 12px; border-radius:7px; cursor:pointer; white-space:nowrap;
  }
  .copy-btn:hover{ color: var(--text); border-color: var(--teal); }

  /* ---------- PROGRESS BAR ---------- */
  .progress-block{ padding: 16px 22px 6px; border-bottom: 1px solid var(--line-soft); }
  .progress-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .progress-top .field-label{ margin-bottom:0; }
  .progress-total{ font-family: var(--font-mono); font-size:12px; color: var(--text-dim); }
  .progress-track{
    height: 16px; border-radius: 999px; overflow:hidden; display:flex;
    background: var(--gray-dim); border: 1px solid var(--line);
  }
  .progress-seg{ height:100%; transition: width .25s ease; }
  .progress-seg.pendente{ background: repeating-linear-gradient(135deg, #3a3f4a 0 6px, #333842 6px 12px); }
  .progress-seg.fazendo{ background: linear-gradient(180deg,#ffc35c,#f2a93b); }
  .progress-seg.concluido{ background: linear-gradient(180deg,#4fe08b,#2fb968); }
  .progress-seg.review-pendente{
  background: repeating-linear-gradient(135deg,#3a3f4a 0 6px,#333842 6px 12px);
}

.progress-seg.review-andamento{
  background: linear-gradient(180deg,#ffc35c,#f2a93b);
}

.progress-seg.review-revisado{
  background: linear-gradient(180deg,#4fe08b,#2fb968);
}

.progress-seg.review-erro{
  background: linear-gradient(180deg,#ff8f70,#e65c3d);
}

.progress-legend .sw.review-pendente{
  background:#3a3f4a;
}

.progress-legend .sw.review-andamento{
  background:#f2a93b;
}

.progress-legend .sw.review-revisado{
  background:#39c879;
}

.progress-legend .sw.review-erro{
  background:#e65c3d;
}
  .progress-legend{ display:flex; gap:16px; margin-top:9px; flex-wrap:wrap; }
  .progress-legend .leg{ font-size:11.5px; color: var(--text-dim); display:flex; align-items:center; gap:6px; font-weight:600;}
  .progress-legend .sw{ width:9px; height:9px; border-radius:3px; }
  .progress-legend .sw.pendente{ background:#3a3f4a; }
  .progress-legend .sw.fazendo{ background: var(--amber); }
  .progress-legend .sw.concluido{ background: var(--green); }

  /* ---------- EDITOR GROUPS ---------- */
  .editors-wrap{ padding: 4px 0 4px; }
  .editor-group{ border-top: 1px solid var(--line-soft); }
  .editor-group:first-child{ border-top:none; }

  .editor-group-header{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: 14px 22px 10px;
    background: var(--panel-3);
    position: relative;

   está alterando. Mudanças feitas por outras pessoas chegam pelo Realtime.

   `store` guarda as linhas como vieram do banco. A partir dele é montada a
   estrutura usada pela tela (igual à da versão 1):
     movie.depts.vocal.editors[]   -> cada editor tem idiomas[] (por idioma)
     movie.depts.efeitos.editors[] -> cada editor tem 1 tarefa (sem idioma)
     movie.depts.musica.editors[]  -> cada editor tem 1 tarefa (sem idioma)
   O progresso GERAL do filme é a média cumulativa das 3 etapas.

   Filme/aba abertos (activeId/activeDept) são preferência de cada pessoa
   e ficam só no navegador dela.
   ========================================================================== */

const TABLES = {
  movies:    'station_movies',
  links:     'station_movie_links',
  editors:   'station_editors',
  rows:      'station_vocal_rows',
  completed: 'station_completed_movies',
  settings:  'station_settings'
};
// Colunas que podem ser nulas no banco (todas as outras são NOT NULL).
const NULLABLE_COLUMNS = new Set(['user_id', 'updated_by', 'production_movie_id', 'concluido_por']);
const store = {};
Object.keys(TABLES).forEach(kind => { store[kind] = new Map(); });

let movies = [];
let completedMovies = [];
let activeId = null;
let productionMovieId = null;
let activeDept = 'vocal';
let currentView = 'production';
let openPickerFor = null;
let pickerSearch = '';

function uid(){ return Math.random().toString(36).slice(2,10); }

function isAdmin(){ return currentAccess.role === 'admin'; }
function isChief(){ return currentAccess.role === 'chief'; }
function canManageWork(){ return isAdmin() || isChief(); }
function canDelete(){ return isAdmin(); }
function canCompleteMovie(){ return isAdmin() || isChief(); }
function canImport(){ return isAdmin(); }
function canExport(){ return isAdmin() || isChief(); }
function ownsEditor(editor){
  return currentAccess.role === 'editor'
    && editor
    && editor.user_id
    && currentUser
    && editor.user_id === currentUser.id;
}

// Espelha as regras do servidor (gatilho station_guard_task_update) só para
// decidir o que mostrar como editável. Quem decide de verdade é o servidor.
function canEditTask(editor, field){
  // Administrador pode alterar tudo
  if(isAdmin()) return true;

  // Chief pode gerenciar a tarefa,
  // mas não pode alterar as datas
  if(isChief()){
    return ['urgencia', 'revisor', 'statusRevisao', 'status'].includes(field);
  }

  // Editor só pode alterar as próprias datas e status
  return ownsEditor(editor)
    && ['inicio', 'entrega', 'status'].includes(field);
}
function readOnlyValue(value, className=''){
  return `<div class="readonly-value ${className}">${esc(value) || '—'}</div>`;
}
async function loadAccess(user){
  currentAccess = { role:'editor', editorName:'' };
  if(!cloudEnabled || !supabaseClient || !user) return;
  const { data, error } = await supabaseClient
    .from('station_user_access')
    .select('role, editor_name')
    .eq('user_id', user.id)
    .maybeSingle();
  if(error){ console.error('Falha ao carregar perfil de acesso', error); return; }
  if(data) currentAccess = { role:data.role || 'editor', editorName:data.editor_name || '' };
}
async function loadStationUsers(){
  stationUsers = [];

  if(!cloudEnabled || !supabaseClient) return;

  const { data, error } = await supabaseClient
    .from('station_user_access')
    .select('user_id, role, editor_name')
    .in('role', ['editor', 'chief'])
    .order('editor_name', { ascending:true });

  if(error){
    console.error('Falha ao carregar usuários da estação', error);
    return;
  }

  stationUsers = data || [];
}
function applyAccessUi(){
  const importBtn = document.getElementById('importBtn');
  const exportBtn = document.getElementById('exportBtn');
  const newUserBtn = document.getElementById('newUserBtn');
  if(importBtn) importBtn.style.display = canImport() ? 'inline-block' : 'none';
  if(exportBtn) exportBtn.style.display = canExport() ? 'inline-block' : 'none';
  if(newUserBtn) newUserBtn.style.display = isAdmin() ? 'inline-block' : 'none';

/* ---------- MONTAGEM DA ESTRUTURA DA TELA A PARTIR DAS LINHAS DO BANCO ---------- */

function byPosition(a, b){
  return ((a.position || 0) - (b.position || 0)) || String(a.id).localeCompare(String(b.id));
}

function rebuildState(){
  const movieById = new Map();
  movies = [...store.movies.values()].sort(byPosition).map(r => {
    const m = {
      id: r.id,
      nome: r.nome || '',
      poster: r.poster || '',
      drive: r.drive || '',
      movieLinks: [],
      depts: { vocal:{ editors:[] }, efeitos:{ editors:[] }, musica:{ editors:[] } }
    };
    movieById.set(m.id, m);
    return m;
  });

  [...store.links.values()].sort(byPosition).forEach(r => {
    const m = movieById.get(r.movie_id);
    if(m) m.movieLinks.push({
      id: r.id,
      type: r.type || 'LINK DOS ARQUIVOS',
      url: r.url || '',
      languages: Array.isArray(r.languages) ? r.languages : []
    });
  });

  const editorById = new Map();
  [...store.editors.values()].sort(byPosition).forEach(r => {
    const m = movieById.get(r.movie_id);
    if(!m || !m.depts[r.dept]) return;
    const e = r.dept === 'vocal'
      ? { id:r.id, nome:r.nome || '', user_id:r.user_id || null, idiomas:[] }
      : { id:r.id, nome:r.nome || '', user_id:r.user_id || null,
          inicio:r.inicio || '', entrega:r.entrega || '',
          urgencia:r.urgencia || 'media', status:r.status || 'pendente' };
    m.depts[r.dept].editors.push(e);
    editorById.set(e.id, e);
  });

  [...store.rows.values()].sort(byPosition).forEach(r => {
    const e = editorById.get(r.editor_id);
    if(e && e.idiomas) e.idiomas.push({
      id: r.id,
      idioma: r.idioma || '',
      inicio: r.inicio || '',
      entrega: r.entrega || '',
      urgencia: r.urgencia || 'media',
      status: r.status || 'pendente',
      revisor: r.revisor || '',
      statusRevisao: r.status_revisao || 'pendente'
    });
  });

  completedMovies = [...store.completed.values()]
    .sort((a, b) => (Date.parse(b.concluido_em) || 0) - (Date.parse(a.concluido_em) || 0))
    .map(r => ({
      id: r.id,
      nome: r.nome || '',
      concluidoEm: r.concluido_em,
      entries: Array.isArray(r.entries) ? r.entries : []
    }));

  const settings = store.settings.get(1);
  productionMovieId = settings ? settings.production_movie_id : null;
}

/* ---------- GRAVAÇÃO NO SERVIDOR ----------
   Todas as gravações passam por uma fila (uma de cada vez, na ordem em que
   foram feitas). Campos de texto esperam TEXT_SAVE_DELAY ms sem digitação
   antes de gravar. A tela é atualizada na hora (otimista); se o servidor
   recusar, os dados são recarregados do servidor. */

let writeChain = Promise.resolve();
let inflightWrites = 0;
let lastWriteFailed = false;
const pendingPatches = new Map();  // "tipo:id" -> { kind, id, patch, timer }
const inflightByKey = new Map();   // "tipo:id" -> gravações em andamento
let lastErrorAlertAt = 0;
let lastFetchAt = 0;

function rowKey(kind, id){ return kind + ':' + id; }

function hasUnsavedChanges(){
  return pendingPatches.size > 0 || inflightWrites > 0;
}

function updateSaveIndicator(){
  if(!currentUser) return;
  if(hasUnsavedChanges()) setSaveStatus('saving', 'Salvando alterações...');
  else if(lastWriteFailed) setSaveStatus('error', 'Erro ao salvar');
  else setSaveStatus('saved', 'Alterações salvas');
}

function setSaveStatus(state, message){
  const status = document.getElementById('saveStatus');

  if(!status) return;

  status.classList.remove('saved', 'saving', 'error');
  if(state) status.classList.add(state);
  status.textContent = '● ' + message;
}

function enqueueWrite(fn){
  inflightWrites++;
  updateSaveIndicator();
  const run = writeChain
    .then(fn)
    .then(
      result => { lastWriteFailed = false; return result; },
      err => { handleWriteError(err); return undefined; }
    )
    .finally(() => { inflightWrites--; updateSaveIndicator(); });
  writeChain = run.catch(() => {});
  return run;
}

function isPermissionError(err){
  return !!err && (err.code === '42501' || err.code === 'PGRST116' || /permiss/i.test(err.message || ''));
}

function handleWriteError(err){
  console.error('Falha ao salvar no servidor', err);
  lastWriteFailed = true;
  const now = Date.now();
  if(now - lastErrorAlertAt > 5000){
    lastErrorAlertAt = now;
    alert(isPermissionError(err)
      ? 'O servidor recusou esta alteração (sem permissão ou o item foi removido por outra pessoa). Os dados serão recarregados.'
      : 'Não foi possível salvar a última alteração. Verifique a conexão. Os dados serão recarregados do servidor.');
  }
  refetchAll().then(requestRender).catch(e => console.error('Falha ao recarregar dados', e));
}

// Aplica uma linha vinda do servidor (resposta de gravação ou Realtime).
function applyServerRow(kind, row, fromRealtime = false){
  if(!row || row.id === undefined || row.id === null) return;
  const key = rowKey(kind, row.id);
  // Há gravação nossa em andamento nessa linha: a resposta dela traz o valor final.
  if(fromRealtime && (inflightByKey.get(key) || 0) > 0) return;

  const existing = store[kind].get(row.id);
  if(existing && existing.updated_at && row.updated_at
     && Date.parse(row.updated_at) < Date.parse(existing.updated_at)) return; // chegou fora de ordem

  const merged = existing ? { ...existing } : {};
  Object.keys(row).forEach(col => {
    const value = row[col];
    // Realtime pode omitir colunas grandes não alteradas (ex.: pôster).
    if(value === undefined) return;
    if(value === null && existing && !NULLABLE_COLUMNS.has(col)) return;
    merged[col] = value;
  });
  const pending = pendingPatches.get(key);
  store[kind].set(row.id, pending ? Object.assign(merged, pending.patch) : merged);
}

function removeLocal(kind, id){
  store[kind].delete(id);
  if(kind === 'movies'){
    for(const [linkId, link] of store.links) if(link.movie_id === id) store.links.delete(linkId);
    for(const [editorId, editor] of store.editors) if(editor.movie_id === id) removeLocal('editors', editorId);
    const settings = store.settings.get(1);
    if(settings && settings.production_movie_id === id) settings.production_movie_id = null;
  }
  if(kind === 'editors'){
    for(const [rowId, row] of store.rows) if(row.editor_id === id) store.rows.delete(rowId);
  }
  // descarta alterações ainda não enviadas de linhas que não existem mais
  for(const [key, p] of pendingPatches){
    if(!store[p.kind].has(p.id)){ clearTimeout(p.timer); pendingPatches.delete(key); }
  }
}

// Altera campos de UMA linha. delay > 0: espera o usuário parar de digitar.
function patchRow(kind, id, patch, delay = 0){
  const row = store[kind].get(id);
  if(!row) return;
  Object.assign(row, patch);
  rebuildState();

  const key = rowKey(kind, id);
  let p = pendingPatches.get(key);
  if(!p){ p = { kind, id, patch:{}, timer:null }; pendingPatches.set(key, p); }
  Object.assign(p.patch, patch);
  clearTimeout(p.timer);
  if(delay > 0){
    p.timer = setTimeout(() => flushPatch(key), delay);
    updateSaveIndicator();
  }else{
    flushPatch(key);
  }
}

function flushPatch(key){
  const p = pendingPatches.get(key);
  if(!p) return Promise.resolve();
  clearTimeout(p.timer);
  pendingPatches.delete(key);
  inflightByKey.set(key, (inflightByKey.get(key) || 0) + 1);
  const done = () => {
    const n = (inflightByKey.get(key) || 1) - 1;
    if(n > 0) inflightByKey.set(key, n); else inflightByKey.delete(key);
  };
  return enqueueWrite(async () => {
    try{
      const { data, error } = await supabaseClient
        .from(TABLES[p.kind])
        .update(p.patch)
        .eq('id', p.id)
        .select()
        .maybeSingle();
      if(error) throw error;
      if(!data) throw Object.assign(new Error('Alteração não aplicada (sem permissão ou item removido).'), { code:'PGRST116' });
      done();
      applyServerRow(p.kind, data);
      rebuildState();
      requestRender();
    }catch(e){
      done();
      throw e;
    }
  });
}

function flushAllPatches(){
  return Promise.all([...pendingPatches.keys()].map(flushPatch));
}

async function insertRow(kind, values){
  return enqueueWrite(async () => {
    const { data, error } = await supabaseClient.from(TABLES[kind]).insert(values).select().single();
    if(error) throw error;
    applyServerRow(kind, data);
    rebuildState();
    return data;
  });
}

function deleteRow(kind, id){
  removeLocal(kind, id);
  rebuildState();
  return enqueueWrite(async () => {
    const { data, error } = await supabaseClient.from(TABLES[kind]).delete().eq('id', id).select('id');
    if(error) throw error;
    if(!data || !data.length) throw Object.assign(new Error('Exclusão não aplicada (sem permissão).'), { code:'PGRST116' });
  });
}

function callRpc(name, args){
  return enqueueWrite(async () => {
    const { data, error } = await supabaseClient.rpc(name, args);
    if(error) throw error;
    return data === null ? true : data;
  });
}

/* ---------- LEITURA DO SERVIDOR ---------- */

async function fetchTable(kind){
  const all = [];
  const pageSize = 1000;
  for(let from = 0; ; from += pageSize){
    const { data, error } = await supabaseClient
      .from(TABLES[kind])
      .select('*')
      .order('id')
      .range(from, from + pageSize - 1);
    if(error) throw error;
    all.push(...data);
    if(data.length < pageSize) break;
  }
  return all;
}

async function fetchAllNow(){
  const kinds = Object.keys(TABLES);
  const results = await Promise.all(kinds.map(fetchTable));
  kinds.forEach((kind, i) => {
    store[kind] = new Map(results[i].map(row => [row.id, row]));
  });
  // alterações locais ainda não enviadas continuam valendo
  for(const p of pendingPatches.values()){
    const row = store[p.kind].get(p.id);
    if(row) Object.assign(row, p.patch);
  }
  lastFetchAt = Date.now();
  rebuildState();
}

// Recarrega tudo, na fila (depois das gravações já pedidas).
function refetchAll(){
  const run = writeChain.then(fetchAllNow);
  writeChain = run.catch(() => {});
  return run;
}

/* ---------- TEMPO REAL ---------- */

let realtimeChannel = null;
let realtimeConnected = false;
let realtimeWasConnected = false;
let pollTimer = null;

function startRealtime(){
  stopRealtime();
  const channel = supabaseClient.channel('estacao-editores-v2');
  Object.entries(TABLES).forEach(([kind, table]) => {
    channel.on('postgres_changes', { event:'*', schema:'public', table }, payload => onRealtimeChange(kind, payload));
  });
  channel.subscribe(status => {
    const connected = status === 'SUBSCRIBED';
    // reconexão: busca o que pode ter mudado enquanto estava desconectado
    if(connected && realtimeWasConnected && !realtimeConnected){
      refetchAll().then(requestRender).catch(e => console.error('Falha ao recarregar dados', e));
    }
    realtimeConnected = connected;
    if(connected) realtimeWasConnected = true;
  });
  realtimeChannel = channel;
  // plano B: se o Realtime não conectar, confere o servidor a cada 30 s
  pollTimer = setInterval(() => {
    if(!realtimeConnected && currentUser && !document.hidden){
      refetchAll().then(requestRender).catch(e => console.error('Falha ao recarregar dados', e));
    }
  }, 30000);
}

function stopRealtime(){
  if(realtimeChannel && supabaseClient) supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel = null;
  realtimeConnected = false;
  realtimeWasConnected = false;
  clearInterval(pollTimer);
  pollTimer = null;
}

function onRealtimeChange(kind, payload){
  if(payload.eventType === 'DELETE'){
    const id = payload.old && payload.old.id;
    if(id === undefined || id === null) return;
    removeLocal(kind, id);
  }else{
    applyServerRow(kind, payload.new, true);
  }
  rebuildState();
  requestRender();
}

/* Não redesenha a tela enquanto a pessoa está digitando/escolhendo algo
   (perderia o foco); redesenha assim que ela sair do campo. */
let renderDeferred = false;
function isEditingField(){
  const el = document.activeElement;
  return !!el && el !== document.body && el.matches('input, select, textarea')
    && !!el.closest('#content, #movieTabs');
}
function requestRender(){
  if(isEditingField()){ renderDeferred = true; return; }
  renderDeferred = false;
  render();
}
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if(renderDeferred && !isEditingField()){ renderDeferred = false; render(); }
  }, 0);
});

/* ---------- PREFERÊNCIAS LOCAIS (filme e aba abertos) ---------- */

function loadUiState(){
  try{
    const saved = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
    activeId = saved.activeId || null;
    activeDept = DEPTS.some(d => d.key === saved.activeDept) ? saved.activeDept : 'vocal';
  }catch(e){
    activeId = null;
    activeDept = 'vocal';
  }
}

function saveUiState(){
  try{ localStorage.setItem(UI_KEY, JSON.stringify({ activeId, activeDept })); }catch(e){}
}

/* ---------- CONVERSÃO DE BACKUPS ANTIGOS (usada pelo "Importar dados") ---------- */

function ensureMovieShape(m){
  if(!m.depts) m.depts = {};
  DEPTS.forEach(d => {
    if(!m.depts[d.key]) m.depts[d.key] = { editors: [] };
    if(!Array.isArray(m.depts[d.key].editors)) m.depts[d.key].editors = [];
  });
  m.depts.vocal.editors.forEach(e => {
    if(!Array.isArray(e.idiomas)) e.idiomas = [];
  });
  return m;
}

function migrateVocalEditorLegacy(e){
  if(Array.isArray(e.idiomas) && e.idiomas.length && typeof e.idiomas[0] === 'string'){
    const oldInicio = e.inicio || '';
    const oldEntrega = e.entrega || '';
    const oldUrg = e.urgencia || 'media';
    const oldStatus = e.status || 'pendente';
    e.idiomas = e.idiomas.map(l => ({ id: uid(), idioma: l, inicio: oldInicio, entrega: oldEntrega, urgencia: oldUrg, status: oldStatus, revisor:'', statusRevisao:'pendente' }));
  }
  if(!Array.isArray(e.idiomas)) e.idiomas = [];
  e.idiomas.forEach(r => { if(!r.statusRevisao) r.statusRevisao = 'pendente'; if(r.revisor===undefined) r.revisor=''; });
  delete e.inicio; delete e.entrega; delete e.urgencia; delete e.status;
  return e;
}

// v2: { vocal:{movies:[...]}, efeitos:{movies:[...]}, musica:{movies:[...]} } — cada
// departamento com sua PRÓPRIA lista de filmes. Unifica por nome do filme.
function migrateV2ToV3(v2){
  const byKey = new Map();
  const order = [];
  DEPTS.forEach(dept => {
    const dm = (v2[dept.key] && Array.isArray(v2[dept.key].movies)) ? v2[dept.key].movies : [];
    dm.forEach(m => {
      const key = (m.nome || '').trim().toLowerCase() || ('__' + m.id);
      if(!byKey.has(key)){
        byKey.set(key, { id: m.id || uid(), nome: m.nome || '', caminho: m.caminho || '', poster: m.poster || '', depts: {} });
        order.push(key);
      }
      const rec = byKey.get(key);
      if(dept.key === 'vocal'){
        (m.editors || []).forEach(migrateVocalEditorLegacy);
        rec.depts.vocal = { editors: (m.editors || []).map(e => ({
          id: e.id || uid(), nome: e.nome || '',
          idiomas: (e.idiomas || []).map(r => ({
            id: r.id || uid(), idioma: r.idioma, inicio: r.inicio || '', entrega: r.entrega || '',
            urgencia: r.urgencia || 'media', status: r.status || 'pendente',
            revisor: r.revisor || '', statusRevisao: r.statusRevisao || 'pendente'
          }))
        })) };
      } else {
        rec.depts[dept.key] = { editors: (m.editors || []).map(e => {
          const rows = Array.isArray(e.idiomas) ? e.idiomas : [];
          const first = rows[0] || {};
          const anyConcluido = rows.some(r => r.status === 'concluido');
          const anyFazendo = rows.some(r => r.status === 'fazendo');
          return {
            id: e.id || uid(), nome: e.nome || '',
            inicio: first.inicio || e.inicio || '',
            entrega: first.entrega || e.entrega || '',
            urgencia: first.urgencia || e.urgencia || 'media',
            status: anyConcluido ? 'concluido' : (anyFazendo ? 'fazendo' : (first.status || e.status || 'pendente'))
          };
        }) };
      }
    });
  });
  const result = order.map(k => byKey.get(k));
  result.forEach(ensureMovieShape);
  return { movies: result, activeMovieId: result.length ? result[0].id : null };
}

// v1: array simples de filmes (painel único, equivalente a Vocal)
function migrateV1ToV3(arr){
  const fakeV2 = { vocal: { movies: arr }, efeitos: { movies: [] }, musica: { movies: [] } };
  return migrateV2ToV3(fakeV2);
}

/* ---------- AÇÕES ---------- */

function switchDept(key){
  activeDept = key;
  openPickerFor = null;
  saveUiState();
  applyDeptTheme();
  render();
}

function applyDeptTheme(){
  document.body.classList.remove('dept-vocal', 'dept-efeitos', 'dept-musica');
  document.body.classList.add('dept-' + activeDept);
}

function exportData(){
  if(!canExport()) return;
  const blob = new Blob([JSON.stringify({ movies, completedMovies, activeMovieId: activeId, productionMovieId }, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'estacao-editores-' + date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  if(!canImport()) return;
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    let payload;
    try{
      const parsed = JSON.parse(evt.target.result);
      if(Array.isArray(parsed)){
        payload = { movies: migrateV1ToV3(parsed).movies, completedMovies: [] };
      }else if(parsed && Array.isArray(parsed.movies)){
        payload = {
          movies: parsed.movies,
          completedMovies: Array.isArray(parsed.completedMovies) ? parsed.completedMovies : [],
          productionMovieId: parsed.productionMovieId || null
        };
      }else if(parsed && (parsed.vocal || parsed.efeitos || parsed.musica)){
        payload = { movies: migrateV2ToV3(parsed).movies, completedMovies: [] };
      }else{
        throw new Error('formato inválido');
      }
    }catch(e){
      alert('Não foi possível importar este arquivo. Verifique se é um backup exportado por este painel.');
      return;
    }
    if(!confirm('Importar este backup vai SUBSTITUIR todos os filmes e o histórico atuais, para todos os usuários. Continuar?')) return;
    const result = await callRpc('station_import', { p: payload });
    if(!result) return;
    try{ await refetchAll(); }catch(e){ console.error(e); }

}

// Escapa texto para HTML (conteúdo e atributos). Aceita qualquer tipo.
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Valor usado como argumento dentro de onclick="..."/onchange="...":
// vira uma string JS válida (JSON) e depois é escapado para o atributo.
function jsArg(v){
  return esc(JSON.stringify(String(v === null || v === undefined ? '' : v)));
}

// Só aceita valores conhecidos (usado em classes CSS e data-*).
function oneOf(value, allowed, fallback){
  return allowed.includes(value) ? value : fallback;
}

/* ---------- CÁLCULO DE PROGRESSO (por etapa e cumulativo do filme) ---------- */

function stageRows(m, deptKey){
  return deptKey === 'vocal'
    ? m.depts.vocal.editors.flatMap(e => e.idiomas)
    : m.depts[deptKey].editors;
}

function stagePercent(m, deptKey){
  const rows = stageRows(m, deptKey);
  if(!rows.length) return 0;
  const concluido = rows.filter(r=>r.status==='concluido').length;
  return Math.round(concluido / rows.length * 100);
}

// Progresso cumulativo do filme: média das 3 etapas — cada etapa contribui
// 1/3 do total, e o valor de uma etapa concluída permanece contando mesmo
// depois de o usuário avançar para a etapa seguinte.
function overallPercent(m){
  const pcts = DEPTS.map(d => stagePercent(m, d.key));
  return Math.round(pcts.reduce((a,b)=>a+b,0) / pcts.length);
}

function deptStatusForMovie(m, deptKey){
  const rows = stageRows(m, deptKey);
  if(!rows.length) return { cls:'vazio', label:'Sem dados' };
  const total = rows.length;
  const concluido = rows.filter(r=>r.status==='concluido').length;
  const pendente = rows.filter(r=>r.status==='pendente').length;
  if(concluido===total) return { cls:'concluido', label:'Concluído' };
  if(pendente===total) return { cls:'pendente', label:'Pendente' };
  return { cls:'fazendo', label:'Fazendo (' + Math.round(concluido/total*100) + '%)' };
}

function startMovieDrag(event, id){
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', id);

function allowMovieDrop(event){
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';

function dropMovie(event, targetId){
  event.preventDefault();
  if(!canManageWork()) return;

  const draggedId = event.dataTransfer.getData('text/plain');

  if(!draggedId || draggedId === targetId) return;

  const order = movies.map(m => m.id);
  const draggedIndex = order.indexOf(draggedId);
  const targetIndex = order.indexOf(targetId);

  if(draggedIndex === -1 || targetIndex === -1) return;

  order.splice(draggedIndex, 1);
  order.splice(order.indexOf(targetId), 0, draggedId);

  // aplica na tela já, e grava a ordem completa no servidor
  order.forEach((id, i) => {
    const row = store.movies.get(id);
    if(row) row.position = i + 1;
  });
  rebuildState();
  callRpc('station_reorder_movies', { p_ids: order });
  render();
}

function toggleLinkLanguageMenu(linkId){
  if(!isAdmin()) return;
  openLinkLangMenuFor = openLinkLangMenuFor === linkId ? null : linkId;
  render();
}

function addLinkLanguage(linkId, languageId){
  if(!isAdmin()) return;
  const link = store.links.get(linkId);
  const language = LINK_LANGUAGES.find(([id]) => id === languageId);
  if(!link || !language) return;
  const current = Array.isArray(link.languages) ? link.languages : [];
  if(!current.some(lang => lang.id === languageId)){
    patchRow('links', linkId, {
      languages: [...current, { id: language[0], country: language[1], name: language[2] }]
    });
  }
  openLinkLangMenuFor = null;
  render();
}

function removeLinkLanguage(linkId, languageId){
  if(!isAdmin()) return;
  const link = store.links.get(linkId);
  if(!link) return;
  const current = Array.isArray(link.languages) ? link.languages : [];
  patchRow('links', linkId, { languages: current.filter(lang => lang.id !== languageId) });
  render();
}

function updateMovieLinkUrl(linkId, value){
  if(!isAdmin()) return;
  patchRow('links', linkId, { url: value }, TEXT_SAVE_DELAY);
}

function copyLinkUrl(linkId, btn){
  const link = store.links.get(linkId);
  copyText(link ? link.url : '', btn);
}

function removeMovieLink(linkId){
  if(!isAdmin()) return;
  deleteRow('links', linkId);
  render();
}

function toggleMovieLinkMenu(movieId) {
  if (!isAdmin()) return;

  const menu = document.getElementById(`movieLinkMenu-${movieId}`);

  if (!menu) return;

  const isVisible = menu.style.display === 'block';

  document.querySelectorAll('[id^="movieLinkMenu-"]').forEach(function(otherMenu) {
    otherMenu.style.display = 'none';
  });

  menu.style.display = isVisible ? 'none' : 'block';
}


function selectMovieLinkType(movieId, type) {
  if (!isAdmin()) return;

  const menu = document.getElementById(`movieLinkMenu-${movieId}`);

  if (menu) {
    menu.style.display = 'none';
  }

  addMovieLink(movieId, type);
}
async function addMovieLink(movieId, type) {
  if (!isAdmin()) return;
  if (!store.movies.has(movieId)) return;

  const existing = [...store.links.values()].filter(link => link.movie_id === movieId);
  await insertRow('links', {
    movie_id: movieId,
    type: MOVIE_LINK_TYPES.includes(type) ? type : 'LINK DOS ARQUIVOS',
    position: nextPosition(existing)
  });
  render();
}

function stageProgressHtml(m, deptKey){

function reviewProgressHtml(m){

      </div>
      <div class="cell">

  const role = document.getElementById('newUserRole').value;

}

    alert(`Usuário ${name} criado com sucesso.`);

async function initSupabase(){
  if(!SUPABASE_URL.startsWith('http') || SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) return;
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
    cloudEnabled = true;
    // sessão encerrada em outra aba ou expirada
    supabaseClient.auth.onAuthStateChange(event => {
      if(event === 'SIGNED_OUT' && currentUser) setTimeout(() => resetSession(), 0);
    });
    const { data:{ session } } = await supabaseClient.auth.getSession();
    if(session?.user) await onAuthenticated(session.user);
  }catch(e){ console.error('Supabase indisponível', e); }
}

async function onAuthenticated(user){
  currentUser = user;

  await loadAccess(user);
  await loadStationUsers();

  try{
    await refetchAll();
  }catch(e){
    console.error('Login realizado, mas os dados não foram carregados.', e);
    setSaveStatus('error', 'Erro ao carregar dados');
    setAuthError('Não foi possível carregar os dados do servidor. Recarregue a página e tente de novo.');
    return;
  }

  loadUiState();
  startRealtime();
  lastWriteFailed = false;
  updateSaveIndicator();

  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('userSession').textContent = user.email || 'Usuário autenticado';
  document.getElementById('logoutBtn').style.display = 'inline-block';

  applyDeptTheme();
  render();
  loadTheme();
}

async function signIn(){
  if(!cloudEnabled){ setAuthError('Configure SUPABASE_URL e SUPABASE_ANON_KEY no código para ativar o login.'); return; }
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) return setAuthError(error.message);
  await onAuthenticated(data.user);
}

function resetSession(){
  stopRealtime();
  pendingPatches.forEach(p => clearTimeout(p.timer));
  pendingPatches.clear();
  Object.keys(store).forEach(kind => store[kind].clear());
  rebuildState();
  currentUser=null; currentAccess={ role:'editor', editorName:'' }; stationUsers=[]; activeId=null;
  document.getElementById('authOverlay').style.display='flex';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('userSession').textContent='';
setSaveStatus('', 'Aguardando sincronização');
render();
}

async function signOut(){
  // envia o que ainda estiver esperando antes de sair
  await flushAllPatches();
  await writeChain;
  if(cloudEnabled && supabaseClient) await supabaseClient.auth.signOut();
  resetSession();
}
function setAuthError(msg){ document.getElementById('authError').textContent=msg || ''; }

// Ao trocar de aba/minimizar: envia o que está pendente. Ao voltar depois
// de um tempo: confere se algo mudou no servidor.
document.addEventListener('visibilitychange', () => {
  if(!currentUser) return;
  if(document.hidden){
    flushAllPatches();
  }else if(Date.now() - lastFetchAt > 60000){
    refetchAll().then(requestRender).catch(e => console.error('Falha ao recarregar dados', e));
  }
});

window.addEventListener('online', () => {
  if(!currentUser) return;
  flushAllPatches();
  refetchAll().then(requestRender).catch(e => console.error('Falha ao recarregar dados', e));
});

window.addEventListener('beforeunload', event => {
  if(currentUser && hasUnsavedChanges()){
    flushAllPatches();
    event.preventDefault();
    event.returnValue = '';
  }
});

loadTheme();
render();
initSupabase();

</script>
</body>
</html>
